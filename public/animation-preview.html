<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 04 · Animation comparison</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f6f2e9;color:#1212cf;font:16px monospace}main{max-width:1100px;margin:auto;padding:16px}#sample{position:relative;width:100%;aspect-ratio:1672/941;--scene-ui:1}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}button,a{color:inherit}input{width:min(500px,65vw)}.note{line-height:1.5}#sample-note{position:absolute;left:20.5%;top:62.5%;width:60.3%;height:7.8%;background:#f6f2e9;display:flex;align-items:center;justify-content:center;z-index:3}</style><main><nav><button id="room">ROOM DRAWING</button><button id="window">WINDOW DRAWING</button><button data-stages="16,17,18">LAMP</button><button data-stages="22,23,23">BED</button><button data-stages="29,29,30">COMPUTER</button><button data-stages="35,35,36">DOOR</button><a href="/">OPEN GAME</a></nav><div id="sample" class="creation-scene"><img class="creation-backdrop" alt="Chapter 04"><div class="creation-fixed-build"></div><div class="creation-fixed-code"></div><div id="sample-note">LIFT PROGRESS · 0%</div><div class="creation-portrait"><svg viewBox="65 1595 690 440" aria-label="PLAYER 01"><image href="/assets/creation/avatar-reference.jpg" width="3838" height="2160"/></svg></div></div><p><label>LIFT PROGRESS <input id="progress" type="range" min="0" max="100" value="0"> <output id="value">0%</output></label></p><p class="note">Move the slider to lift. Stop moving to pause. In the game, pinch and lift, then release at 100% to finish. All six builds are drawn continuously from lift progress.</p></main><script type="module">
import {createCreationRenderer} from '/js/creation-renderer.js';
const root=document.querySelector('#sample'),renderer=createCreationRenderer(root),slider=document.querySelector('#progress');let stages=[2,3,4];
renderer.icon('build',root.querySelector('.creation-fixed-build'));renderer.icon('code',root.querySelector('.creation-fixed-code'));
function set(){renderer.raise(stages,Number(slider.value)/100);document.querySelector('#value').textContent=slider.value+'%';document.querySelector('#sample-note').textContent='LIFT PROGRESS · '+slider.value+'%';}
function choose(next){renderer.stopRaise();stages=next;slider.value=0;renderer.show(next[0]);set();}
document.querySelector('#room').onclick=()=>choose([2,3,4]);document.querySelector('#window').onclick=()=>choose([9,10,11]);document.querySelectorAll('[data-stages]').forEach(b=>b.onclick=()=>choose(b.dataset.stages.split(',').map(Number)));slider.oninput=set;choose(stages);window.addEventListener('pagehide',()=>renderer.dispose());
</script></html>
