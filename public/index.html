<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save File: Me</title><link rel="stylesheet" href="/style.css"></head><body>
<main id="viewport" aria-label="互动叙事场景"><div id="stage"><div id="visual"></div><div id="hotspots"></div><button id="back" class="corner" hidden aria-label="SAVE ROOM">SAVE ROOM</button></div></main>
<section id="dev-panel" hidden aria-label="开发测试面板"><div class="panel-head"><strong>开发测试 · Shift+D</strong><button id="dev-close">隐藏</button></div><p id="dev-state"></p><p id="save-status" role="status"></p><p>正常入口：窗户 → Wonder，灯 → Escape，电脑 → Retry & Connection，书架 → Creation。按顺序解锁，门在四章完成后进入 Final。</p><div id="dev-actions"></div><button id="complete-chapter" hidden>临时完成当前章节 → 返回序章</button><p id="wonder-progress"></p><button id="reset-wonder">重置第一章进度</button><p>只清除第一章探索和小游戏进度，保留总章节存档，重新进入第一章。</p><p id="escape-progress"></p><button id="reset-escape">重置第二章进度</button><p>仅清除第二章探索和游戏进度，保留总章节存档及第一章。</p><p id="retry-progress"></p><button id="reset-retry">重置第三章进度</button><button data-retry-test="0">测试第三章：从第一次战斗开始</button><button data-retry-test="3">测试第三章：三次失败后邀请</button><button data-creation-test="start">RESTART CHAPTER 04</button><button data-creation-test="run">TEST CHAPTER 04 RUN</button><button id="reset-assembly">重置初始序章粒子聚合</button><button id="reset" class="danger">重置全部进度</button><details><summary>本章待实现交互</summary><div id="chapter-plan"></div></details><details id="asset-browser" hidden><summary>第一章素材查看（不计通关）</summary><div id="asset-options"></div></details><section id="camera-controls" hidden><p>摄像头与手势接口预留；食指定位，捏合点击/抓取/拖动/放下，上抬建造，持续捏合长按。鼠标不是最终交互。</p><p id="camera-status" role="status">摄像头未开启 · 手势识别尚未接入</p><button id="camera-start">开启摄像头预览</button><button id="camera-stop">关闭摄像头</button><video id="camera-video" muted playsinline hidden></video></section></section>
<script type="module" src="/js/app.js?v=creation-test1"></script></body></html>
