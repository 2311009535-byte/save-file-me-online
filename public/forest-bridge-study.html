<!doctype html><html lang="en" data-road-study data-forest-study><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunset forest — integration preview</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172023;color:#ffedcb;font:14px/1.5 monospace}#scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}#scroll::-webkit-scrollbar{display:none}#track{position:relative;height:700vh}#view{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}canvas{width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672 / 941;display:block}header{position:fixed;left:22px;top:16px;right:22px;pointer-events:none}header p{margin:0;color:#acb8b3;font-size:12px}footer{position:fixed;bottom:24px;left:15%;right:15%;text-align:center;pointer-events:none;text-shadow:0 2px 5px #000}#meter{height:3px;width:160px;background:#ffffff20;margin:12px auto}#fill{display:block;height:100%;background:#edb878;width:0}#restart{position:fixed;top:20px;right:22px;color:#ffedcb;background:#172023;border:1px solid #ffedcb66;padding:8px 14px;cursor:pointer;font:inherit}#error{color:#ffb7a2}button:focus-visible{outline:2px solid #ffedcb}#scroll:focus-visible{outline:2px solid #ffedcb;outline-offset:-3px}
